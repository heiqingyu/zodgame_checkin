name: Keepalive

on:
  schedule:
    - cron: "0 0 1 * *"        # 每月1号 UTC 0点
  workflow_dispatch:            # 保留手动触发，方便测试

permissions:
  actions: write                # API 方式需要这个，不是 contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
