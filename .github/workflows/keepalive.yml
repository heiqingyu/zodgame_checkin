name: Keepalive

on:
  schedule:
    - cron: "0 0 1 * *"   # 每月1号 UTC 0点触发，可根据需要调整

permissions:
  contents: write         # 需要写入权限才能推送提交

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 获取完整历史，以便计算上次提交时间

      - name: Check last commit age and push empty commit if needed
        uses: actions/github-script@v7
        with:
          script: |
            const exec = require('child_process').execSync;
            // 获取最后一次提交的时间戳（Unix秒）
            const lastCommitTime = parseInt(exec('git log -1 --format=%ct').toString().trim());
            const now = Math.floor(Date.now() / 1000);
            const daysSinceLastCommit = (now - lastCommitTime) / 86400;
            console.log(`上次提交距今 ${daysSinceLastCommit.toFixed(1)} 天`);

            // 如果超过45天，则创建一个空提交并推送
            if (daysSinceLastCommit > 45) {
              console.log('即将创建空提交以保持仓库活跃...');
              exec('git config user.name "github-actions[bot]"');
              exec('git config user.email "github-actions[bot]@users.noreply.github.com"');
              exec('git commit --allow-empty -m "chore: keepalive empty commit"');
              exec('git push origin HEAD');
              console.log('空提交已推送。');
            } else {
              console.log('仓库仍然活跃，无需操作。');
            }
